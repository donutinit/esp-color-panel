; ESP32-C3 SuperMini: 3 encoders + 7 interruptores para el Micro Color Panel falso.
; Compilar y flashear:  pio run -d firmware/c3 -t upload
; Ver lo que hace:      python3 tools/c3_probar.py
[env:c3]
platform = espressif32
board = esp32-c3-devkitm-1
framework = arduino
monitor_speed = 115200
; Serial = el USB nativo (USB Serial/JTAG), no el UART de GPIO20/21
build_flags = -DARDUINO_USB_MODE=1 -DARDUINO_USB_CDC_ON_BOOT=1
