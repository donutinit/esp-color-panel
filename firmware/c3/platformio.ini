; ESP32-C3 SuperMini: 3 encoders + 7 switches for the fake Micro Color Panel.
; Build and flash:  pio run -d firmware/c3 -t upload
; Watch it:         python3 tools/c3_test.py
[env:c3]
platform = espressif32
board = esp32-c3-devkitm-1
framework = arduino
monitor_speed = 115200
; Serial = the native USB (USB Serial/JTAG), not the UART on GPIO20/21
build_flags = -DARDUINO_USB_MODE=1 -DARDUINO_USB_CDC_ON_BOOT=1
